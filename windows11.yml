services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
      USERNAME: ${WINDOWS_USERNAME:?Set WINDOWS_USERNAME in .env}
      PASSWORD: ${WINDOWS_PASSWORD:?Set WINDOWS_PASSWORD in .env}
      RAM_SIZE: ${RAM_SIZE:-3G}
      CPU_CORES: ${CPU_CORES:-2}
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
    volumes:
      - /tmp/pc-free-windows:/storage
    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"
    stop_grace_period: 2m
    restart: on-failure:5
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8006/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
